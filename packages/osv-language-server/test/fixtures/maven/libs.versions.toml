[versions]
jackson = "2.9.8"
rich = { strictly = "[1.0,2.0)", prefer = "1.5" }

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j_api = "org.slf4j:slf4j-api:1.7.30"
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version = "3.12.0" }
richlib = { module = "org.example:rich", version.ref = "rich" }
inline-rich = { module = "org.example:inline", version = { require = "1.2.3" } }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version = "1.9.0" }
