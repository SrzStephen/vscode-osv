name: Release

# Run it from the Actions tab (Release > Run workflow) on main. It bumps the versions, stamps
# the changelog, verifies, commits and tags the bump on main, then publishes. Nothing is
# edited or tagged by hand. Add the "## Unreleased" changelog entries first (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump: patch, minor, major, or an explicit X.Y.Z"
        type: string
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump versions and changelog
        id: bump
        run: |
          node --import tsx scripts/release-prepare.ts "$INPUT_VERSION"
          npm install --package-lock-only --ignore-scripts
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Refuse to release over an existing tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.bump.outputs.version }}" >/dev/null; then
            echo "::error::tag v${{ steps.bump.outputs.version }} already exists"
            exit 1
          fi
      - name: Save the bump as a patch for the publish job
        run: git diff > "$RUNNER_TEMP/release.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration -w vscode-osv
      - name: Pre-commit hook end-to-end test
        run: |
          pip install pre-commit
          scripts/test-precommit.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Holds OVSX_PAT and the Azure ids, and is the OIDC subject for Entra
    # (repo:<org>/<repo>:environment:release). Add required reviewers here for a manual gate.
    environment: release
    permissions:
      contents: write # push the version commit and tag, create the GitHub release
      id-token: write # OIDC: npm trusted publishing (and provenance) and Azure login
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: ${{ runner.temp }}
      - name: Apply the version bump and check every published version agrees
        run: |
          git apply "$RUNNER_TEMP/release.patch"
          ext=$(node -p "require('./packages/vscode-osv/package.json').version")
          server=$(node -p "require('./packages/osv-language-server/package.json').version")
          hook=$(sed -n 's/.*"osv-language-server@\([^"]*\)".*/\1/p' .pre-commit-hooks.yaml)
          echo "version=$VERSION vscode-osv=$ext osv-language-server=$server pre-commit pin=$hook"
          if [ "$ext" != "$VERSION" ] || [ "$server" != "$VERSION" ] || [ "$hook" != "$VERSION" ]; then
            echo "::error::vscode-osv ($ext), osv-language-server ($server) and the .pre-commit-hooks.yaml pin ($hook) must all equal $VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with some Node releases
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Package VSIX
        run: npm run package -w vscode-osv
      - name: Preflight (npm publish dry run and VSIX package)
        run: |
          npm publish -w osv-language-server --dry-run
          (cd packages/vscode-osv && npx vsce package --no-dependencies -o "$RUNNER_TEMP/preflight.vsix")
      # Last step before anything irreversible: if main moved since this run started, the push
      # is rejected here and nothing has been published.
      - name: Commit the bump and tag it on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath packages/vscode-osv/*.vsix
      - name: Publish to Open VSX
        run: npx ovsx publish packages/vscode-osv/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Authenticates through npm trusted publishing (OIDC); no token. Provenance is automatic.
      - name: Publish osv-language-server to npm
        run: npm publish -w osv-language-server --access public
      - name: Create GitHub release with VSIX
        run: gh release create "v$VERSION" packages/vscode-osv/*.vsix --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
