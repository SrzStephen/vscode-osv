name: Release

# Runs only when a version tag is pushed. Prepare the release first with
# `npm run release:prepare -- X.Y.Z` (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration -w vscode-osv
      - name: Pre-commit hook end-to-end test
        run: |
          pip install pre-commit
          scripts/test-precommit.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Holds OVSX_PAT and the Azure ids, and is the OIDC subject for Entra
    # (repo:<org>/<repo>:environment:release). Add required reviewers here for a manual gate.
    environment: release
    permissions:
      contents: write # create the GitHub release and attach the VSIX
      id-token: write # OIDC: npm trusted publishing (and provenance) and Azure login
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches every published version
        run: |
          ext=$(node -p "require('./packages/vscode-osv/package.json').version")
          server=$(node -p "require('./packages/osv-language-server/package.json').version")
          hook=$(sed -n 's/.*"osv-language-server@\([^"]*\)".*/\1/p' .pre-commit-hooks.yaml)
          echo "tag=$GITHUB_REF_NAME vscode-osv=$ext osv-language-server=$server pre-commit pin=$hook"
          if [ "$GITHUB_REF_NAME" != "v$ext" ] || [ "$server" != "$ext" ] || [ "$hook" != "$ext" ]; then
            echo "::error::tag $GITHUB_REF_NAME must equal v<version> for vscode-osv ($ext), osv-language-server ($server) and the .pre-commit-hooks.yaml pin ($hook)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node 22
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Package VSIX
        run: npm run package -w vscode-osv
      - name: Preflight (npm publish dry run and VSIX package)
        run: |
          npm publish -w osv-language-server --dry-run
          (cd packages/vscode-osv && npx vsce package --no-dependencies -o "$RUNNER_TEMP/preflight.vsix")
      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --azure-credential --packagePath packages/vscode-osv/*.vsix
      - name: Publish to Open VSX
        run: npx ovsx publish packages/vscode-osv/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Authenticates through npm trusted publishing (OIDC); no token. Provenance is automatic.
      - name: Publish osv-language-server to npm
        run: npm publish -w osv-language-server --access public
      - name: Create GitHub release with VSIX
        run: gh release create "$GITHUB_REF_NAME" packages/vscode-osv/*.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
